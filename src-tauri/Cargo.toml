[package]
name = "bfg-repo-cleaner-gui"
version = "0.1.0"
edition = "2024"
authors = ["Lucas M. R. Thomaz <lucasmrthomaz@gmail.com>"]
description = "Cross-platform GUI for BFG Repo Cleaner Native"
license = "GPL-3.0-or-later"

[lib]
name = "bfg_repo_cleaner_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-opener = "2.0"
tauri-plugin-dialog = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
rfd = "0.15"
git2 = "0.18"
bfg-repo-cleaner-native = { path = ".." }
