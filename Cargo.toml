[package]
name = "bfg-repo-cleaner-native"
version = "0.1.0"
edition = "2024"
authors = ["Lucas M. R. Thomaz <lucasmrthomaz@gmail.com>", "Roberto Tyley <https://github.com/rtyley>"]
description = "A fast, native Rust implementation of the BFG Repo Cleaner for scrubbing secrets and large files from Git history."
readme = "README.md"
repository = "https://github.com/lucasmrthomaz/bfg-repo-cleaner-thz"
license = "GPL-3.0-or-later"
keywords = ["git", "bfg", "repo-cleaner", "security", "git-history"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
# Git ODB operations / Operações Git ODB
git2 = "0.18"

# Regular Expression matching & redaction / Regex e expurgo de dados
regex = "1.10"

# Command Line Interface (CLI) parser / Parser da CLI
clap = { version = "4.5", features = ["derive", "string"] }

# Terminal coloring / Cores e formatação no terminal
colored = "2.1"

# Error handling / Tratamento de erros
anyhow = "1.0"
